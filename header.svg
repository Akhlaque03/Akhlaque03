<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- 20 Gradient Themes -->
    <linearGradient id="g1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#00c6ff"/></linearGradient>
    <linearGradient id="g2"><stop stop-color="#160b24"/><stop offset="1" stop-color="#b026ff"/></linearGradient>
    <linearGradient id="g3"><stop stop-color="#061b2b"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <linearGradient id="g4"><stop stop-color="#03140b"/><stop offset="1" stop-color="#00ff88"/></linearGradient>
    <linearGradient id="g5"><stop stop-color="#241207"/><stop offset="1" stop-color="#ff9d00"/></linearGradient>
    <linearGradient id="g6"><stop stop-color="#210719"/><stop offset="1" stop-color="#ff1493"/></linearGradient>
    <linearGradient id="g7"><stop stop-color="#071225"/><stop offset="1" stop-color="#4169ff"/></linearGradient>
    <linearGradient id="g8"><stop stop-color="#100727"/><stop offset="1" stop-color="#7b2cff"/></linearGradient>
    <linearGradient id="g9"><stop stop-color="#061d20"/><stop offset="1" stop-color="#00ffd5"/></linearGradient>
    <linearGradient id="g10"><stop stop-color="#210606"/><stop offset="1" stop-color="#ff3030"/></linearGradient>
    <linearGradient id="g11"><stop stop-color="#10133d"/><stop offset="1" stop-color="#7067ff"/></linearGradient>
    <linearGradient id="g12"><stop stop-color="#061d12"/><stop offset="1" stop-color="#39ff88"/></linearGradient>
    <linearGradient id="g13"><stop stop-color="#06182a"/><stop offset="1" stop-color="#00bfff"/></linearGradient>
    <linearGradient id="g14"><stop stop-color="#17072c"/><stop offset="1" stop-color="#c04cff"/></linearGradient>
    <linearGradient id="g15"><stop stop-color="#211307"/><stop offset="1" stop-color="#ffb000"/></linearGradient>
    <linearGradient id="g16"><stop stop-color="#260719"/><stop offset="1" stop-color="#ff39c9"/></linearGradient>
    <linearGradient id="g17"><stop stop-color="#06152b"/><stop offset="1" stop-color="#168cff"/></linearGradient>
    <linearGradient id="g18"><stop stop-color="#061e24"/><stop offset="1" stop-color="#00d9c5"/></linearGradient>
    <linearGradient id="g19"><stop stop-color="#17062b"/><stop offset="1" stop-color="#914cff"/></linearGradient>
    <linearGradient id="g20"><stop stop-color="#17100a"/><stop offset="1" stop-color="#d7a52b"/></linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Each scene = 1 second -->
    <style>
      .scene {
        opacity: 0;
        animation: show 20s infinite;
      }

      .s1  { animation-delay: 0s; }
      .s2  { animation-delay: 1s; }
      .s3  { animation-delay: 2s; }
      .s4  { animation-delay: 3s; }
      .s5  { animation-delay: 4s; }
      .s6  { animation-delay: 5s; }
      .s7  { animation-delay: 6s; }
      .s8  { animation-delay: 7s; }
      .s9  { animation-delay: 8s; }
      .s10 { animation-delay: 9s; }
      .s11 { animation-delay: 10s; }
      .s12 { animation-delay: 11s; }
      .s13 { animation-delay: 12s; }
      .s14 { animation-delay: 13s; }
      .s15 { animation-delay: 14s; }
      .s16 { animation-delay: 15s; }
      .s17 { animation-delay: 16s; }
      .s18 { animation-delay: 17s; }
      .s19 { animation-delay: 18s; }
      .s20 { animation-delay: 19s; }

      @keyframes show {
        0%, 4.5% { opacity: 1; }
        5%, 100% { opacity: 0; }
      }

      text {
        font-family: Arial, Helvetica, sans-serif;
      }

      .name {
        font-size: 42px;
        font-weight: 700;
        fill: white;
      }

      .role {
        font-size: 18px;
        fill: #d7e8ff;
      }

      .tag {
        font-size: 17px;
        fill: white;
      }

      .small {
        font-size: 13px;
        fill: #d7e8ff;
      }
    </style>
