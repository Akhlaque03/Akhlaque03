<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">

<defs>

  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%">
      <animate attributeName="stop-color"
        values="#020617;#0f172a;#111827;#172554;#1e1b4b;#2e1065;#450a0a;#7f1d1d;#4c0519;#431407;#422006;#713f12;#365314;#064e3b;#042f2e;#083344;#164e63;#1e3a8a;#312e81;#020617"
        dur="20s" repeatCount="indefinite"/>
    </stop>

    <stop offset="55%">
      <animate attributeName="stop-color"
        values="#1d4ed8;#2563eb;#4f46e5;#6366f1;#7c3aed;#9333ea;#dc2626;#ef4444;#e11d48;#f43f5e;#ea580c;#f59e0b;#84cc16;#22c55e;#14b8a6;#06b6d4;#0ea5e9;#3b82f6;#8b5cf6;#1d4ed8"
        dur="20s" repeatCount="indefinite"/>
    </stop>

    <stop offset="100%">
      <animate attributeName="stop-color"
        values="#312e81;#1e40af;#3730a3;#4338ca;#6d28d9;#7e22ce;#991b1b;#b91c1c;#be123c;#9f1239;#c2410c;#ca8a04;#4d7c0f;#15803d;#0f766e;#0e7490;#0369a1;#1d4ed8;#7c3aed;#312e81"
        dur="20s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path d="M35 0H0V35" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </pattern>

  <clipPath id="clip">
    <rect width="1200" height="320" rx="35"/>
  </clipPath>

</defs>

<g clip-path="url(#clip)">

<rect width="1200" height="320" fill="url(#bg)"/>

<g opacity=".18">
  <circle cx="100" cy="70" r="140" fill="#ffffff">
    <animate attributeName="cx" values="100;1100;100" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="260" r="180" fill="#ffffff">
    <animate attributeName="cy" values="260;40;260" dur="20s" repeatCount="indefinite"/>
  </circle>
</g>

<rect width="1200" height="320" fill="url(#grid)" opacity=".7"/>

<g fill="none" stroke="#ffffff" opacity=".18">
  <circle cx="160" cy="160" r="80">
    <animate attributeName="r" values="40;120;40" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="160" r="110">
    <animate attributeName="r" values="130;50;130" dur="20s" repeatCount="indefinite"/>
  </circle>
</g>

<g fill="#ffffff" opacity=".045">
  <path d="M0 0 L220 0 L800 320 L580 320 Z"/>
  <path d="M700 0 L850 0 L1200 190 L1200 320 Z"/>
</g>

<g fill="#ffffff">
  <circle cx="120" cy="100" r="3"/>
  <circle cx="250" cy="250" r="2"/>
  <circle cx="950" cy="80" r="3"/>
  <circle cx="1080" cy="220" r="2"/>
  <circle cx="800" cy="55" r="2"/>
  <circle cx="400" cy="70" r="2"/>
</g>

<path d="M0 270 Q300 180 600 250 T1200 210"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      opacity=".35">
  <animate attributeName="d"
    values="M0 270 Q300 180 600 250 T1200 210;
            M0 220 Q300 290 600 190 T1200 260;
            M0 270 Q300 180 600 250 T1200 210"
    dur="20s" repeatCount="indefinite"/>
</path>

<ellipse cx="600" cy="0" rx="450" ry="100"
         fill="#ffffff" opacity=".08" filter="url(#softGlow)"/>

<ellipse cx="600" cy="320" rx="500" ry="80"
         fill="#ffffff" opacity=".06" filter="url(#softGlow)"/>

<circle cx="0" cy="320" r="160"
        fill="none" stroke="#ffffff" stroke-width="2" opacity=".12"/>

<circle cx="1200" cy="0" r="160"
        fill="none" stroke="#ffffff" stroke-width="2" opacity=".12"/>

<circle cx="600" cy="150" r="125"
        fill="#ffffff" opacity=".025">
  <animate attributeName="r"
           values="90;150;90"
           dur="20s" repeatCount="indefinite"/>
</circle>

<g stroke="#ffffff" opacity=".05">
  <path d="M0 70H1200"/>
  <path d="M0 140H1200"/>
  <path d="M0 210H1200"/>
  <path d="M0 280H1200"/>
</g>

<g stroke="#ffffff" opacity=".04">
  <path d="M180 0V320"/>
  <path d="M360 0V320"/>
  <path d="M840 0V320"/>
  <path d="M1020 0V320"/>
</g>

<path d="M600 15 L735 160 L600 305 L465 160 Z"
      fill="none" stroke="#ffffff"
      stroke-width="1.5" opacity=".1"/>

<rect x="12" y="12" width="1176" height="296"
      rx="30" fill="none"
      stroke="#ffffff" stroke-width="1.5" opacity=".18"/>

<g fill="#ffffff">
  <circle cx="330" cy="110" r="2">
    <animate attributeName="opacity"
             values=".1;1;.1" dur="2s"
             repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="105" r="2">
    <animate attributeName="opacity"
             values="1;.1;1" dur="2s"
             repeatCount="indefinite"/>
  </circle>
</g>

<ellipse cx="40" cy="160" rx="100" ry="180"
         fill="#ffffff" opacity=".025"
         filter="url(#softGlow)"/>

<ellipse cx="1160" cy="160" rx="100" ry="180"
         fill="#ffffff" opacity=".025"
         filter="url(#softGlow)"/>

<path d="M0 250 C200 180 350 300 600 220 C850 140 1000 260 1200 190 L1200 320 L0 320Z"
      fill="#ffffff" opacity=".025"/>

<path d="M0 40 C250 110 350 0 600 80 C850 160 1000 30 1200 100"
      fill="none" stroke="#ffffff"
      stroke-width="2" opacity=".07"/>

<rect x="390" y="158" width="420" height="2"
      rx="2" fill="#ff3b3b"
      filter="url(#glow)">
  <animate attributeName="width"
           values="300;500;300"
           dur="2s" repeatCount="indefinite"/>
  <animate attributeName="x"
           values="450;350;450"
           dur="2s" repeatCount="indefinite"/>
</rect>

<g transform="translate(600 160)"
   fill="none"
   stroke="#ffffff"
   opacity=".12">
  <circle r="155" stroke-dasharray="20 35">
    <animateTransform attributeName="transform"
      type="rotate"
      from="0" to="360"
      dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle r="175" stroke-dasharray="8 50">
    <animateTransform attributeName="transform"
      type="rotate"
      from="360" to="0"
      dur="20s" repeatCount="indefinite"/>
  </circle>
</g>

<text x="600" y="128"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="44"
      font-weight="700"
      filter="url(#glow)">
  <tspan fill="#ffffff">Hi 👋, </tspan>
  <tspan fill="#ff3b3b">I'm Akhlaque Alam</tspan>
</text>

<text x="600" y="205"
      text-anchor="middle"
      font-family="Fira Code, monospace"
      font-size="22"
      font-weight="500"
      fill="#34d399">
  Aspiring Data Scientist
</text>

<text x="600" y="245"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      letter-spacing="4"
      fill="#ffffff"
      opacity=".75">
  DATA • MACHINE LEARNING • ANALYTICS
</text>

</g>
</svg>
