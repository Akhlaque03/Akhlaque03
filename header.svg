  <!-- 01 — CYBER BLUE -->
  <!-- ========================= -->
  <g class="scene s1">
    <rect width="1200" height="300" fill="url(#g1)"/>
    <circle cx="1010" cy="145" r="100" fill="none" stroke="#00c6ff"
            stroke-width="2" opacity=".4"/>
    <circle cx="1010" cy="145" r="70" fill="none" stroke="#00c6ff"
            stroke-width="2" opacity=".6"/>
    <text x="70" y="100" class="name">Akhlaque Alam</text>
    <text x="70" y="135" class="role">Data Scientist • ML Engineer • Problem Solver</text>
    <text x="70" y="190" class="tag">Turning Data Into Real-World Impact</text>
    <text x="70" y="225" class="small">Python  •  SQL  •  Machine Learning  •  AI</text>
  </g>


