name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: akhlaque03
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ffffff&color_dots=#0d1117,#004d25,#008a45,#00c853,#39ff88

      - name: Push Snake to output branch
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: "Update contribution snake"
          add: "dist"
          new_branch: output
